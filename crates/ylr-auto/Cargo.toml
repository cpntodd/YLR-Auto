[package]
name = "ylr-auto"
description = "A desktop companion for MakeMKV that files finished rips into Jellyfin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
indexmap = "2"
ksni = { version = "0.3", features = ["blocking"] }
log = { version = "0.4", features = ["std"] }
serde_json = "1"
ylr-core = { path = "../ylr-core" }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "gui_smoke"
harness = false

[lints]
workspace = true
